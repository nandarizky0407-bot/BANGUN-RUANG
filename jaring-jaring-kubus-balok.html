<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jaring-Jaring Kubus &amp; Balok — Presentasi Interaktif Kelas 5-6 SD</title>
<meta name="description" content="Presentasi interaktif jaring-jaring kubus dan balok untuk siswa kelas 5-6 SD: animasi lipat 3D, putar bangun ruang, 11 jaring kubus, jaring balok, lab alas-atap, serta 18 soal latihan dan kuis.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Jaring-Jaring Kubus & Balok — Presentasi Interaktif Kelas 5-6 SD
   Gaya: ceria warna-warni (gradasi biru-ungu, kartu membulat)
   ============================================================ */
:root {
  --bg1: #4f46e5; --bg2: #7c3aed; --bg3: #db2777;
  --ink: #1e1b4b; --ink-soft: #4b4768;
  --card: #ffffff;
  --yellow: #facc15; --orange: #f97316; --red: #ef4444;
  --green: #22c55e; --blue: #3b82f6; --purple: #a855f7; --pink: #ec4899; --teal: #14b8a6;
  --shadow: 0 10px 30px rgba(30, 27, 75, .18);
  --radius: 22px;
  --font-head: 'Baloo 2', 'Comic Sans MS', 'Segoe UI', sans-serif;
  --font-body: 'Nunito', 'Segoe UI', 'Comic Sans MS', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: var(--font-body);
  color: var(--ink);
  background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 48%, var(--bg3) 100%);
  overflow: hidden;
}

/* ---------- dekorasi latar ---------- */
#bgDecor { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
#bgDecor span {
  position: absolute; opacity: .16; border-radius: 18%;
  background: #fff; animation: floaty 9s ease-in-out infinite;
}
@keyframes floaty { 0%,100% { transform: translateY(0) rotate(8deg); } 50% { transform: translateY(-26px) rotate(-6deg); } }

/* ---------- topbar ---------- */
#topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  display: flex; align-items: center; gap: 14px;
  padding: 10px 18px;
}
#brand {
  font-family: var(--font-head); font-weight: 800; color: #fff;
  font-size: 15px; letter-spacing: .4px; text-shadow: 0 2px 8px rgba(0,0,0,.25);
  white-space: nowrap; display: flex; align-items: center; gap: 8px;
}
#brand .dotlogo { width: 22px; height: 22px; border-radius: 6px; background: conic-gradient(#facc15,#ef4444,#a855f7,#3b82f6,#22c55e,#facc15); box-shadow: 0 2px 6px rgba(0,0,0,.3); }
#progressWrap { flex: 1; height: 12px; background: rgba(255,255,255,.25); border-radius: 99px; overflow: hidden; box-shadow: inset 0 1px 4px rgba(0,0,0,.15); }
#progressBar { height: 100%; width: 10%; border-radius: 99px; background: linear-gradient(90deg, #facc15, #f97316, #ec4899); transition: width .5s cubic-bezier(.5,1.4,.5,1); }
#slideCounter { color: #fff; font-weight: 800; font-size: 13px; background: rgba(255,255,255,.18); padding: 5px 12px; border-radius: 99px; white-space: nowrap; }
.icon-btn {
  width: 36px; height: 36px; border: none; border-radius: 12px; cursor: pointer;
  background: rgba(255,255,255,.2); color: #fff; display: grid; place-items: center;
  transition: background .2s, transform .15s; flex: 0 0 auto;
}
.icon-btn:hover { background: rgba(255,255,255,.38); transform: translateY(-1px); }
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn.off { opacity: .5; }

/* ---------- deck & slide ---------- */
#deck { position: fixed; inset: 0; z-index: 10; }
.slide {
  position: absolute; inset: 0; display: none;
  padding: 58px 26px 86px;
}
.slide.active { display: flex; }
.slide-inner {
  margin: auto; width: min(1180px, 100%); max-height: 100%;
  display: flex; flex-direction: column; gap: 18px;
  overflow-y: auto; padding: 6px 4px 10px;
  scrollbar-width: thin;
}
.slide.anim-r .slide-inner { animation: slideR .55s cubic-bezier(.3,1.25,.45,1) both; }
.slide.anim-l .slide-inner { animation: slideL .55s cubic-bezier(.3,1.25,.45,1) both; }
@keyframes slideR { from { opacity: 0; transform: translateX(70px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes slideL { from { opacity: 0; transform: translateX(-70px) scale(.97); } to { opacity: 1; transform: none; } }

.kicker {
  align-self: center; font-weight: 900; font-size: 12.5px; letter-spacing: 2.5px;
  color: #fff; background: rgba(255,255,255,.16); border: 1.5px solid rgba(255,255,255,.35);
  padding: 6px 18px; border-radius: 99px; text-transform: uppercase;
}
h1.judul {
  font-family: var(--font-head); font-weight: 800; text-align: center; color: #fff;
  font-size: clamp(30px, 5.4vw, 58px); line-height: 1.08; text-shadow: 0 4px 0 rgba(0,0,0,.12);
}
h1.judul .grad { background: linear-gradient(90deg, #fde047, #fca5a5, #f0abfc); -webkit-background-clip: text; background-clip: text; color: transparent; }
h2.slide-title {
  font-family: var(--font-head); font-weight: 800; color: #fff; text-align: center;
  font-size: clamp(22px, 3.4vw, 36px); text-shadow: 0 3px 0 rgba(0,0,0,.12);
}
p.sub { text-align: center; color: rgba(255,255,255,.92); font-weight: 700; font-size: clamp(14px, 1.9vw, 17.5px); max-width: 760px; align-self: center; }

/* ---------- tombol umum ---------- */
.btn {
  font-family: var(--font-head); font-weight: 700; font-size: 16.5px; color: var(--ink);
  border: none; cursor: pointer; border-radius: 99px; padding: 13px 30px;
  background: #fff; box-shadow: 0 6px 0 rgba(30,27,75,.22), var(--shadow);
  display: inline-flex; align-items: center; gap: 10px; justify-content: center;
  transition: transform .15s, box-shadow .15s, filter .2s;
}
.btn:hover { transform: translateY(-2px); filter: brightness(1.03); }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(30,27,75,.22); }
.btn.primary { background: linear-gradient(135deg, #facc15, #fb923c); color: #7c2d12; font-size: 18px; padding: 15px 36px; }
.btn.green { background: linear-gradient(135deg, #4ade80, #22c55e); color: #052e16; }
.btn.pink { background: linear-gradient(135deg, #f9a8d4, #ec4899); color: #831843; }
.btn.small { font-size: 14px; padding: 9px 20px; box-shadow: 0 4px 0 rgba(30,27,75,.2); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn svg { width: 18px; height: 18px; }

/* ---------- kartu ---------- */
.card {
  background: var(--card); border-radius: var(--radius); padding: 18px 20px;
  box-shadow: var(--shadow); border: 3px solid rgba(30,27,75,.06);
}
.card h3 { font-family: var(--font-head); font-weight: 800; font-size: 19px; margin-bottom: 6px; display: flex; align-items: center; gap: 9px; }
.card p { font-size: 15px; font-weight: 600; color: var(--ink-soft); line-height: 1.55; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; font-weight: 800; font-size: 13px;
  background: #eef2ff; color: #3730a3; border-radius: 99px; padding: 7px 14px;
}
.chip .sw { width: 13px; height: 13px; border-radius: 4px; display: inline-block; }

/* ---------- COVER ---------- */
#slide-cover .slide-inner { align-items: center; justify-content: center; text-align: center; gap: 22px; }
.cover-cube-wrap { height: clamp(130px, 20vh, 180px); display: grid; place-items: center; perspective: 900px; }
.cover-cube { width: var(--cs); height: var(--cs); position: relative; transform-style: preserve-3d; animation: spinCube 14s linear infinite; }
.cover-cube .cf {
  position: absolute; inset: 0; border-radius: 14px; border: 3px solid rgba(255,255,255,.75);
  display: grid; place-items: center; font-family: var(--font-head); font-weight: 800;
  font-size: calc(var(--cs) * .3); color: rgba(255,255,255,.95); text-shadow: 0 2px 6px rgba(0,0,0,.25);
  box-shadow: inset 0 0 24px rgba(255,255,255,.25); backface-visibility: hidden;
}
@keyframes spinCube { from { transform: rotateX(-18deg) rotateY(0); } to { transform: rotateX(-18deg) rotateY(360deg); } }
.cover-actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.cover-note { color: rgba(255,255,255,.75); font-size: 13px; font-weight: 700; }

/* ---------- PETA MATERI ---------- */
.menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; }
.menu-card {
  position: relative; background: #fff; border-radius: 20px; padding: 18px 18px 16px;
  cursor: pointer; border: none; text-align: left; font-family: var(--font-body);
  box-shadow: 0 6px 0 rgba(30,27,75,.16), var(--shadow);
  transition: transform .18s cubic-bezier(.3,1.4,.5,1), box-shadow .18s;
  display: flex; flex-direction: column; gap: 7px;
}
.menu-card:hover { transform: translateY(-5px) rotate(-.6deg); }
.menu-card .m-icon {
  width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center;
  font-size: 22px; font-weight: 900; color: #fff; font-family: var(--font-head);
}
.menu-card h4 { font-family: var(--font-head); font-weight: 800; font-size: 17.5px; color: var(--ink); }
.menu-card p { font-size: 13px; color: var(--ink-soft); font-weight: 600; line-height: 1.45; }
.menu-card .go {
  position: absolute; right: 14px; top: 16px; width: 30px; height: 30px; border-radius: 10px;
  display: grid; place-items: center; background: #eef2ff; color: #4f46e5; font-weight: 900;
}

/* ---------- layout 2 kolom ---------- */
.two-col { display: grid; grid-template-columns: 1.05fr 1fr; gap: 20px; align-items: stretch; }
@media (max-width: 880px) { .two-col { grid-template-columns: 1fr; } }
.panel3d {
  position: relative; border-radius: var(--radius); overflow: hidden; min-height: 340px;
  background: radial-gradient(120% 120% at 30% 20%, rgba(255,255,255,.28), rgba(255,255,255,.06));
  border: 3px solid rgba(255,255,255,.35); box-shadow: inset 0 0 40px rgba(30,27,75,.12);
  display: grid; place-items: center; touch-action: none; cursor: grab;
}
.panel3d:active { cursor: grabbing; }
.panel3d .drag-hint {
  position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
  font-size: 12px; font-weight: 800; color: #fff; background: rgba(30,27,75,.35);
  padding: 5px 14px; border-radius: 99px; pointer-events: none; white-space: nowrap; z-index: 6;
}
.panel3d .drag-hint svg { width: 14px; height: 14px; vertical-align: -2px; }
.panel3d .corner-tag {
  position: absolute; top: 10px; left: 12px; font-family: var(--font-head); font-weight: 800;
  color: #fff; font-size: 14px; background: rgba(30,27,75,.3); padding: 4px 13px; border-radius: 99px;
  pointer-events: none; z-index: 6;
}

/* ---------- scene 3D ---------- */
.scene { width: 100%; height: 100%; display: grid; place-items: center; perspective: 1200px; overflow: visible; }
.stage { transform-style: preserve-3d; will-change: transform; }
.net { position: relative; transform-style: preserve-3d; }
.face {
  position: absolute; border-radius: 6px; border: 2.5px solid rgba(30,27,75,.45);
  box-shadow: inset 0 0 18px rgba(255,255,255,.35), inset 0 -8px 18px rgba(30,27,75,.14);
  display: grid; place-items: center; transform-style: preserve-3d;
  transition: transform 1s cubic-bezier(.35,1.2,.45,1);
  transition-delay: calc(var(--d, 0) * 110ms);
  background-size: cover;
}
.face .fl {
  font-family: var(--font-head); font-weight: 800; color: #fff;
  text-shadow: 0 2px 5px rgba(0,0,0,.4); pointer-events: none; text-align: center; line-height: 1.05;
}
.face .fl small { display: block; font-size: .58em; font-weight: 700; opacity: .92; }
.net.folded .face[data-dir=above] { transform: rotateX(90deg); }
.net.folded .face[data-dir=below] { transform: rotateX(-90deg); }
.net.folded .face[data-dir=left] { transform: rotateY(-90deg); }
.net.folded .face[data-dir=right] { transform: rotateY(90deg); }
.face[data-dir=above] { transform-origin: 50% 100%; }
.face[data-dir=below] { transform-origin: 50% 0%; }
.face[data-dir=left] { transform-origin: 100% 50%; }
.face[data-dir=right] { transform-origin: 0% 50%; }
.face.hl-alas { border-color: #dc2626; box-shadow: 0 0 0 3px rgba(220,38,38,.65), inset 0 0 20px rgba(255,255,255,.4); }
.face.hl-atap { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.7), inset 0 0 20px rgba(255,255,255,.4); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.25); } }

/* box utuh (kubus/balok bab pengenalan) */
.box3d { position: relative; transform-style: preserve-3d; }
.box3d .bf {
  position: absolute; border-radius: 8px; border: 2.5px solid rgba(30,27,75,.4);
  box-shadow: inset 0 0 22px rgba(255,255,255,.35), inset 0 -10px 22px rgba(30,27,75,.16);
  display: grid; place-items: center;
}
.box3d .bf .fl { font-family: var(--font-head); font-weight: 800; color: #fff; text-shadow: 0 2px 5px rgba(0,0,0,.4); font-size: 20px; }

/* ---------- galeri ---------- */
.gallery { display: flex; flex-direction: column; gap: 12px; }
.gallery-group h4 {
  font-family: var(--font-head); font-weight: 800; color: #fff; font-size: 14.5px;
  margin-bottom: 7px; display: flex; align-items: center; gap: 8px;
}
.gallery-group h4 .cnt { background: rgba(255,255,255,.25); padding: 2px 10px; border-radius: 99px; font-size: 12px; }
.thumbs { display: flex; flex-wrap: wrap; gap: 9px; }
.thumb {
  background: rgba(255,255,255,.94); border: 3px solid transparent; border-radius: 14px;
  padding: 5px; cursor: pointer; line-height: 0; transition: transform .16s, border-color .16s, box-shadow .16s;
  box-shadow: 0 4px 10px rgba(30,27,75,.18);
}
.thumb:hover { transform: translateY(-3px) rotate(-1deg); }
.thumb.sel { border-color: #facc15; box-shadow: 0 0 0 3px rgba(250,204,21,.45), 0 6px 14px rgba(30,27,75,.25); }
.thumb svg { width: 74px; height: auto; }

/* ---------- lab alas-atap ---------- */
#labMsg {
  min-height: 58px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
  gap: 12px; font-weight: 800; font-size: 15.5px; text-align: center; padding: 10px 16px;
  background: #eef2ff; color: #3730a3; border: 2.5px dashed #c7d2fe; flex-wrap: wrap;
}
#labMsg b.alas { color: #dc2626; } #labMsg b.atap { color: #2563eb; }
.net-svg .face-r { stroke: rgba(30,27,75,.5); stroke-width: 2; cursor: pointer; transition: filter .15s; }
.net-svg .face-r:hover { filter: brightness(1.12); }
.net-svg .face-r.static { cursor: default; }
.net-svg .face-r.alas { stroke: #dc2626; stroke-width: 4.5; }
.net-svg .face-r.atap { stroke: #2563eb; stroke-width: 4.5; animation: svpulse 1.1s ease-in-out infinite; }
@keyframes svpulse { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: .45; } }
.net-svg text { pointer-events: none; font-family: var(--font-head); font-weight: 800; }
.badge-alas, .badge-atap { font-size: 11px; letter-spacing: 1px; }

/* ---------- latihan / kuis ---------- */
#quizArea { display: flex; flex-direction: column; gap: 14px; }
.mode-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 16px; }
.mode-card {
  background: #fff; border-radius: 22px; padding: 22px; cursor: pointer; text-align: center;
  border: none; font-family: var(--font-body); box-shadow: 0 7px 0 rgba(30,27,75,.16), var(--shadow);
  transition: transform .18s cubic-bezier(.3,1.4,.5,1); display: flex; flex-direction: column; gap: 9px; align-items: center;
}
.mode-card:hover { transform: translateY(-5px); }
.mode-card .m-emoji { font-size: 0; width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center; }
.mode-card h4 { font-family: var(--font-head); font-size: 20px; font-weight: 800; }
.mode-card p { font-size: 13.5px; color: var(--ink-soft); font-weight: 600; line-height: 1.5; }
.q-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
.q-prog { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
.q-prog i { width: 11px; height: 11px; border-radius: 4px; background: rgba(255,255,255,.35); }
.q-prog i.done { background: #4ade80; } .q-prog i.now { background: #facc15; transform: scale(1.25); } .q-prog i.fail { background: #f87171; }
.level-chip { font-weight: 900; font-size: 12px; letter-spacing: 1.2px; padding: 5px 14px; border-radius: 99px; color: #fff; text-transform: uppercase; }
.level-Mudah { background: #22c55e; } .level-Sedang { background: #f59e0b; } .level-Tantangan { background: #ef4444; }
.q-card { display: grid; grid-template-columns: minmax(230px, 380px) 1fr; gap: 18px; align-items: start; }
@media (max-width: 880px) { .q-card { grid-template-columns: 1fr; } }
.q-svg-wrap { background: #fff; border-radius: 18px; padding: 12px; box-shadow: var(--shadow); display: grid; place-items: center; }
.q-svg-wrap svg { width: 100%; max-width: 330px; height: auto; }
.q-body { display: flex; flex-direction: column; gap: 13px; }
.q-prompt { background: #fff; border-radius: 18px; padding: 16px 18px; font-weight: 700; font-size: 15.5px; line-height: 1.55; color: var(--ink); box-shadow: var(--shadow); }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.opt {
  font-family: var(--font-head); font-weight: 800; font-size: 15.5px; color: var(--ink);
  background: #fff; border: 3px solid #e2e8f0; border-radius: 16px; padding: 13px 12px;
  cursor: pointer; display: flex; align-items: center; gap: 10px; justify-content: center;
  transition: transform .14s, border-color .14s, background .2s; box-shadow: 0 4px 0 rgba(30,27,75,.12);
  min-height: 58px;
}
.opt:hover { transform: translateY(-2px); border-color: #a5b4fc; }
.opt .sw { width: 20px; height: 20px; border-radius: 6px; flex: 0 0 auto; box-shadow: inset 0 -3px 6px rgba(0,0,0,.18); }
.opt.correct { background: #dcfce7; border-color: #22c55e; color: #166534; }
.opt.wrong { background: #fee2e2; border-color: #ef4444; color: #991b1b; }
.opt.dim { opacity: .5; }
.opt:disabled { cursor: default; }
.opt.big-yes:hover { border-color: #22c55e; } .opt.big-no:hover { border-color: #ef4444; }
.explain {
  border-radius: 18px; padding: 15px 18px; background: #fefce8; border: 3px solid #fde047;
  font-weight: 600; font-size: 14.5px; line-height: 1.6; color: #713f12;
  display: none; flex-direction: column; gap: 10px;
}
.explain.show { display: flex; animation: popIn .4s cubic-bezier(.3,1.4,.5,1); }
.explain.good { background: #f0fdf4; border-color: #86efac; color: #14532d; }
.explain.bad { background: #fef2f2; border-color: #fca5a5; color: #7f1d1d; }
.explain .ex-title { font-family: var(--font-head); font-weight: 800; font-size: 16.5px; display: flex; gap: 8px; align-items: center; }
.explain .mini-svg { background: #fff; border-radius: 12px; padding: 8px; align-self: flex-start; }
.explain .mini-svg svg { width: 150px; height: auto; display: block; }
@keyframes popIn { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
.q-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.result-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.score-big {
  font-family: var(--font-head); font-weight: 800; font-size: clamp(44px, 8vw, 74px); color: #fff;
  text-shadow: 0 4px 0 rgba(0,0,0,.15); line-height: 1;
}
.stars { font-size: 0; letter-spacing: 6px; }
.stars svg { width: 44px; height: 44px; }
.review-grid { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; max-width: 560px; }
.review-grid .rv {
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
  font-weight: 900; font-size: 14px; color: #fff; font-family: var(--font-head);
}
.rv.ok { background: #22c55e; } .rv.no { background: #ef4444; }

/* ---------- ikon dalam konten ---------- */
.ex-title svg, .opt svg, .rv svg, .m-emoji svg { width: 1.2em; height: 1.2em; flex: 0 0 auto; }
.m-emoji svg { width: 30px; height: 30px; }
.explain { overflow: hidden; }
.explain .mini-svg { max-width: 100%; }

/* ---------- penutup ---------- */
.recap-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; }

/* ---------- nav bawah ---------- */
#navBtns { position: fixed; right: 20px; bottom: 18px; z-index: 60; display: flex; gap: 10px; align-items: center; }
.nav-btn {
  border: none; cursor: pointer; border-radius: 16px; background: rgba(255,255,255,.92);
  color: var(--ink); display: grid; place-items: center;
  box-shadow: 0 5px 0 rgba(30,27,75,.2), var(--shadow); transition: transform .15s, box-shadow .15s;
}
.nav-btn:hover { transform: translateY(-2px); }
.nav-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(30,27,75,.2); }
.nav-btn.big { width: 54px; height: 54px; }
.nav-btn.small-r { width: 44px; height: 44px; }
.nav-btn svg { width: 24px; height: 24px; }
.nav-btn:disabled { opacity: .4; cursor: default; transform: none; }
#pageTip {
  position: fixed; left: 20px; bottom: 24px; z-index: 60; color: rgba(255,255,255,.8);

(function () {
'use strict';
const D = window.PRESENTATION_DATA;
const App = window.App = {};

// ---------- util ----------
App.$ = (s, r) => (r || document).querySelector(s);
App.el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
App.clamp = clamp;

App.PALETTE = D.palette;
App.LETTERS = 'ABCDEF';
function shade(hex, pct) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const f = c => clamp(Math.round(c * (100 + pct) / 100), 0, 255);
  return '#' + ((1 << 24) + (f(r) << 16) + (f(g) << 8) + f(b)).toString(16).slice(1);
}
App.shade = shade;

App.labelFaces = function (faces) {
  const sorted = faces.map((f, i) => ({ f, i })).sort((a, b) => a.f.y - b.f.y || a.f.x - b.f.x);
  sorted.forEach((s, k) => { faces[s.i].label = App.LETTERS[k]; });
  return faces;
};
App.facesFromCells = cells => App.labelFaces(cells.map(([x, y]) => ({ x, y, w: 1, h: 1 })));

App.netSVG = function (facesIn, o = {}) {
  const faces = facesIn.map(f => ({ ...f }));
  App.labelFaces(faces);
  const u = o.unit || 52, pad = (o.pad != null ? o.pad : 12);
  const xs = faces.map(f => f.x), ys = faces.map(f => f.y);

  const W = Math.max(...faces.map(f => f.x + f.w)) - minX, H = Math.max(...faces.map(f => f.y + f.h)) - minY;
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', `${-pad} ${-pad} ${W * u + pad * 2} ${H * u + pad * 2}`);
  svg.setAttribute('class', 'net-svg' + (o.svgClass ? ' ' + o.svgClass : ''));
  faces.forEach(f => {
    const r = document.createElementNS(ns, 'rect');

    svg.appendChild(r);

    const cx = (f.x - minX + f.w / 2) * u, cy = (f.y - minY + f.h / 2) * u;

      const t2 = document.createElementNS(ns, 'text');

    if (o.markAlas === f.label || o.markAtap === f.label) {
      const b = document.createElementNS(ns, 'text');

// ---------- ketetanggaan persegi panjang (sisi penuh) ----------
function edgeMatch(a, b) {
  if (Math.abs((a.x + a.w) - b.x) < 1e-9 && Math.abs(a.y - b.y) < 1e-9 && Math.abs(a.h - b.h) < 1e-9) return true;
  if (Math.abs((b.x + b.w) - a.x) < 1e-9 && Math.abs(a.y - b.y) < 1e-9 && Math.abs(a.h - b.h) < 1e-9) return true;
  if (Math.abs((a.y + a.h) - b.y) < 1e-9 && Math.abs(a.x - b.x) < 1e-9 && Math.abs(a.w - b.w) < 1e-9) return true;
  if (Math.abs((b.y + b.h) - a.y) < 1e-9 && Math.abs(a.x - b.x) < 1e-9 && Math.abs(a.w - b.w) < 1e-9) return true;
  return false;
}

// ---------- simulasi lipatan runtime: pasangan berhadapan & tetangga ----------
App.netFold = function (facesIn) {
  const V = (x, y, z) => ({ x, y, z });
  const add = (a, b) => V(a.x + b.x, a.y + b.y, a.z + b.z);
  const sub = (a, b) => V(a.x - b.x, a.y - b.y, a.z - b.z);
  const crs = (a, b) => V(a.y * b.z - a.z * b.y, a.z * b.x - a.x * b.z, a.x * b.y - a.y * b.x);
  const dot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
  const unit = a => { const l = Math.hypot(a.x, a.y, a.z); return V(a.x / l, a.y / l, a.z / l); };
  const rotV = (v, u, th) => {
    const c = Math.cos(th), s = Math.sin(th), cr = crs(u, v), d = dot(u, v) * (1 - c);
    return V(v.x * c + cr.x * s + u.x * d, v.y * c + cr.y * s + u.y * d, v.z * c + cr.z * s + u.z * d);
  };
  const get = (v, i) => (i === 0 ? v.x : i === 1 ? v.y : v.z);
  const rotM = (u, th) => {
    const cols = [0, 1, 2].map(j => rotV(V(j === 0 ? 1 : 0, j === 1 ? 1 : 0, j === 2 ? 1 : 0), u, th));
    return [0, 1, 2].map(i => [0, 1, 2].map(j => get(cols[j], i)));
  };
  const mV = (R, v) => V(
    R[0][0] * v.x + R[0][1] * v.y + R[0][2] * v.z,
    R[1][0] * v.x + R[1][1] * v.y + R[1][2] * v.z,
    R[2][0] * v.x + R[2][1] * v.y + R[2][2] * v.z);
  const mM = (A, B) => [0, 1, 2].map(i => [0, 1, 2].map(j => A[i][0] * B[0][j] + A[i][1] * B[1][j] + A[i][2] * B[2][j]));
  const qk = v => Math.round(v.x * 1e4) + '_' + Math.round(v.y * 1e4) + '_' + Math.round(v.z * 1e4);
  const faces = facesIn.map(f => ({ ...f }));
  App.labelFaces(faces);
  const n = faces.length, IDENT = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
  const adj = Array.from({ length: n }, () => []);
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) if (edgeMatch(faces[i], faces[j])) { adj[i].push(j); adj[j].push(i); }
  const R = Array(n).fill(null), T = Array(n).fill(null);
  R[0] = IDENT; T[0] = V(0, 0, 0);
  const seen = new Set([0]), q = [0];
  const edgePts = (a, b) => {
    if (Math.abs((a.x + a.w) - b.x) < 1e-9) return [V(a.x + a.w, a.y, 0), V(a.x + a.w, a.y + a.h, 0)];
    if (Math.abs((b.x + b.w) - a.x) < 1e-9) return [V(a.x, a.y, 0), V(a.x, a.y + a.h, 0)];
    if (Math.abs((a.y + a.h) - b.y) < 1e-9) return [V(a.x, a.y + a.h, 0), V(a.x + a.w, a.y + a.h, 0)];
    return [V(a.x, a.y, 0), V(a.x + a.w, a.y, 0)];
  };
  while (q.length) {
    const p = q.shift();
    for (const c of adj[p]) {
      if (seen.has(c)) continue; seen.add(c);
      const [ea, eb] = edgePts(faces[p], faces[c]);
      const A = add(mV(R[p], ea), T[p]), B = add(mV(R[p], eb), T[p]);
      const u = unit(sub(B, A));
      const cc = add(mV(R[p], V(faces[c].x + faces[c].w / 2, faces[c].y + faces[c].h / 2, 0)), T[p]);
      const np = mV(R[p], V(0, 0, 1));
      let best = null;
      for (const th of [Math.PI / 2, -Math.PI / 2]) {
        const ncc = add(rotV(sub(cc, A), u, th), A);
        const s = dot(sub(ncc, cc), np);
        if (!best || s < best.s) best = { th, s };
      }
      R[c] = mM(rotM(u, best.th), R[p]);
      T[c] = add(rotV(sub(T[p], A), u, best.th), A);
      q.push(c);
    }
  }
  const normals = R.map(r => mV(r, V(0, 0, 1)));
  const axisOf = nm => ['x', 'y', 'z'][[Math.abs(nm.x), Math.abs(nm.y), Math.abs(nm.z)].indexOf(1)];
  const oppositeOf = Array(n).fill(-1);
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++)
    if (i !== j && axisOf(normals[i]) === axisOf(normals[j]) && dot(normals[i], normals[j]) < 0) oppositeOf[i] = j;
  const corners = faces.map((f, i) => [
    add(mV(R[i], V(f.x, f.y, 0)), T[i]), add(mV(R[i], V(f.x + f.w, f.y, 0)), T[i]),
    add(mV(R[i], V(f.x + f.w, f.y + f.h, 0)), T[i]), add(mV(R[i], V(f.x, f.y + f.h, 0)), T[i])]);
  const cset = corners.map(cs => new Set(cs.map(qk)));
  const adj3d = Array.from({ length: n }, () => []);
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
    let sh = 0; cset[i].forEach(k => { if (cset[j].has(k)) sh++; });
    if (sh === 2) { adj3d[i].push(j); adj3d[j].push(i); }
  }
  return { oppositeOf, adj3d, ok: new Set(normals.map(qk)).size === 6 && seen.size === n };
};

// ---------- orbit (drag putar + auto) ----------
App.makeOrbit = function (scene, stage, opts = {}) {
  const st = { rx: opts.rx != null ? opts.rx : -22, ry: opts.ry != null ? opts.ry : -30, auto: !!opts.auto, drag: false, stopped: false };
  const apply = () => { stage.style.transform = `rotateX(${st.rx}deg) rotateY(${st.ry}deg)`; };
  apply();
  let px = 0, py = 0;
  scene.addEventListener('pointerdown', e => { st.drag = true; st.auto = false; px = e.clientX; py = e.clientY; scene.setPointerCapture(e.pointerId); });
  scene.addEventListener('pointermove', e => {
    if (!st.drag) return;
    st.ry += (e.clientX - px) * 0.45;
    st.rx = clamp(st.rx - (e.clientY - py) * 0.35, -88, 88);
    px = e.clientX; py = e.clientY; apply();
  });
  const up = () => { st.drag = false; };
  scene.addEventListener('pointerup', up); scene.addEventListener('pointercancel', up);
  if (st.auto) {
    const tick = () => { if (!st.stopped) { if (st.auto && !st.drag) { st.ry += 0.22; apply(); } requestAnimationFrame(tick); } };
    requestAnimationFrame(tick);
  }
  return { state: st, apply, setAuto: v => { st.auto = v; }, stopAuto: () => { st.auto = false; st.stopped = true; } };
};

// ---------- pembangun jaring lipat 3D ----------
App.buildFoldable = function (mount, facesIn, opts = {}) {
  const faces = facesIn.map(f => ({ ...f }));
  App.labelFaces(faces);
  const n = faces.length;
  const adj = Array.from({ length: n }, () => []);
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
    if (edgeMatch(faces[i], faces[j])) { adj[i].push(j); adj[j].push(i); }
  }
  let base = opts.base;
  if (base == null) { let bd = -1; for (let i = 0; i < n; i++) if (adj[i].length > bd) { bd = adj[i].length; base = i; } }
  const dirOf = Array(n).fill(null), depth = Array(n).fill(0);
  const seen = new Set([base]); const q = [base];
  while (q.length) {
    const p = q.shift();
    for (const c of adj[p]) {
      if (seen.has(c)) continue; seen.add(c);
      dirOf[c] = faces[c].y === faces[p].y
        ? (faces[c].x < faces[p].x ? 'left' : 'right')
        : (faces[c].y < faces[p].y ? 'above' : 'below');
      depth[c] = depth[p] + 1; q.push(c);
    }
  }
  // skala agar muat
  const minX = Math.min(...faces.map(f => f.x)), minY = Math.min(...faces.map(f => f.y));
  const bw = Math.max(...faces.map(f => f.x + f.w)) - minX, bh = Math.max(...faces.map(f => f.y + f.h)) - minY;
  const rect = mount.getBoundingClientRect();
  const maxW = (rect.width || 420) - 30, maxH = (rect.height || 360) - 40;
  let u = opts.unit || Math.max(20, Math.min(maxW / bw, maxH / bh, opts.maxUnit || 78));
  const scene = App.el('div', 'scene'), stage = App.el('div', 'stage'), net = App.el('div', 'net');
  stage.style.width = bw * u + 'px'; stage.style.height = bh * u + 'px';
  net.style.position = 'absolute'; net.style.inset = '0';
  stage.appendChild(net); scene.appendChild(stage);
  Array.from(mount.children).forEach(ch => { if (ch.classList && ch.classList.contains('scene')) ch.remove(); });
  mount.appendChild(scene);
  const els = Array(n).fill(null);
  const buildFace = (idx, parentEl, stepX, stepY, dir, dep) => {
    const f = faces[idx];
    const el = App.el('div', 'face');
    el.dataset.dir = dir || 'root';
    el.style.setProperty('--d', dep);
    el.style.left = stepX * u + 'px'; el.style.top = stepY * u + 'px';
    el.style.width = f.w * u + 'px'; el.style.height = f.h * u + 'px';
    el.style.background = `linear-gradient(150deg, ${App.PALETTE[f.label]}, ${App.shade(App.PALETTE[f.label], -14)})`;
    const lab = App.el('div', 'fl');
    lab.style.fontSize = Math.min(u * (opts.sizes ? 0.34 : 0.42), 30) + 'px';
    lab.textContent = f.label;
    if (opts.sizes && (f.w !== 1 || f.h !== 1)) {
      const s = App.el('small'); s.textContent = f.w + '×' + f.h; lab.appendChild(s);
    }
    el.appendChild(lab);
    parentEl.appendChild(el); els[idx] = el;
    for (const c of adj[idx]) {
      if (els[c]) continue;
      let sx = 0, sy = 0, d2;
      if (faces[c].y === faces[idx].y) {
        d2 = faces[c].x < faces[idx].x ? 'left' : 'right';
        sx = d2 === 'left' ? -faces[c].w : faces[idx].w;
      } else {
        d2 = faces[c].y < faces[idx].y ? 'above' : 'below';
        sy = d2 === 'above' ? -faces[c].h : faces[idx].h;
      }
      buildFace(c, el, sx, sy, d2, dep + 1);
    }
  };
  buildFace(base, net, faces[base].x - minX, faces[base].y - minY, null, 0);
  if (opts.folded) net.classList.add('folded');
  const orbit = App.makeOrbit(scene, stage, { rx: opts.rx != null ? opts.rx : -20, ry: opts.ry != null ? opts.ry : -26, auto: opts.auto });
  const api = {
    scene, stage, net, els, faces, u,
    setFolded: v => net.classList.toggle('folded', v),
    isFolded: () => net.classList.contains('folded'),
    toggle: () => net.classList.toggle('folded'),
    highlight(alasIdx, atapIdx) {
      els.forEach(e => e && e.classList.remove('hl-alas', 'hl-atap'));
      if (alasIdx != null && els[alasIdx]) els[alasIdx].classList.add('hl-alas');
      if (atapIdx != null && els[atapIdx]) els[atapIdx].classList.add('hl-atap');
    },
    clearHL() { this.highlight(null, null); },
    orbit,
  };
  return api;
};

// ---------- kotak utuh (kubus / balok pengenalan) ----------
App.buildBox = function (mount, dims, colors, labels, opts = {}) {
  const { w, h, d } = dims;
  const scene = App.el('div', 'scene'), stage = App.el('div', 'stage'), box = App.el('div', 'box3d');
  const sc = opts.scale || 1;
  stage.style.width = w * sc + 'px'; stage.style.height = h * sc + 'px';
  box.style.position = 'absolute'; box.style.inset = '0';
  const F = [
    { fw: w, fh: h, t: `translateZ(${d / 2 * sc}px)` },
    { fw: w, fh: h, t: `rotateY(180deg) translateZ(${d / 2 * sc}px)` },
    { fw: d, fh: h, t: `rotateY(90deg) translateZ(${w / 2 * sc}px)` },
    { fw: d, fh: h, t: `rotateY(-90deg) translateZ(${w / 2 * sc}px)` },
    { fw: w, fh: d, t: `rotateX(90deg) translateZ(${h / 2 * sc}px)` },
    { fw: w, fh: d, t: `rotateX(-90deg) translateZ(${h / 2 * sc}px)` },
  ];
  F.forEach((f, i) => {
    const el = App.el('div', 'bf');
    el.style.width = f.fw * sc + 'px'; el.style.height = f.fh * sc + 'px';
    el.style.left = (w - f.fw) / 2 * sc + 'px'; el.style.top = (h - f.fh) / 2 * sc + 'px';
    el.style.transform = f.t;
    el.style.background = `linear-gradient(150deg, ${colors[i]}, ${App.shade(colors[i], -16)})`;
    const lab = App.el('div', 'fl'); lab.textContent = labels[i];
    el.appendChild(lab);
    box.appendChild(el);
  });
  stage.appendChild(box); scene.appendChild(stage);
  Array.from(mount.children).forEach(ch => { if (ch.classList && ch.classList.contains('scene')) ch.remove(); });
  mount.appendChild(scene);
  const orbit = App.makeOrbit(scene, stage, { rx: -16, ry: -28, auto: opts.auto !== false });
  return { scene, stage, orbit };
};

// ---------- confetti & suara ----------
App.burst = function (x, y) {
  const cols = ['#facc15', '#fb923c', '#f87171', '#4ade80', '#60a5fa', '#c084fc', '#f472b6'];
  for (let i = 0; i < 18; i++) {
    const c = App.el('div', 'confetti');
    c.style.left = x + 'px'; c.style.top = y + 'px';
    c.style.background = cols[i % cols.length];
    document.body.appendChild(c);
    const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 130;
    c.animate([
      { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
      { transform: `translate(${Math.cos(a) * v}px, ${Math.sin(a) * v - 60}px) rotate(${Math.random() * 500}deg)`, opacity: 0 },
    ], { duration: 850 + Math.random() * 350, easing: 'cubic-bezier(.2,.7,.4,1)' }).onfinish = () => c.remove();
  }
};
let actx = null;
App.sfx = {
  muted: false,
  _ctx() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return actx; },
  tone(freq, t0, dur, type) {
    const c = this._ctx(); if (!c || this.muted) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, c.currentTime + t0);
    g.gain.exponentialRampToValueAtTime(0.16, c.currentTime + t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + dur + 0.05);
  },
  ok() { this.tone(523, 0, .16); this.tone(659, .1, .16); this.tone(784, .2, .26); },
  no() { this.tone(196, 0, .22, 'square'); this.tone(147, .14, .3, 'square'); },
  click() { this.tone(660, 0, .07, 'triangle'); },
  pop() { this.tone(880, 0, .1, 'triangle'); },
};

// ============================================================
// DECK
// ============================================================
const deck = App.deck = {
  slides: [], cur: -1, built: [],
  add(def) { this.slides.push(def); },
  goTo(i, dir) {
    i = clamp(i, 0, this.slides.length - 1);
    if (i === this.cur) return;
    const prev = this.cur;
    this.cur = i;
    const sl = this.slides[i];
    const elSl = document.getElementById(sl.id);
    if (!this.built[i]) { sl.build(document.getElementById(sl.id)); this.built[i] = true; }
    document.querySelectorAll('.slide').forEach(s => s.classList.remove('active', 'anim-r', 'anim-l'));
    elSl.classList.add('active', dir === -1 ? 'anim-l' : 'anim-r');
    App.$('#progressBar').style.width = ((i + 1) / this.slides.length * 100) + '%';
    App.$('#slideCounter').textContent = (i + 1) + ' / ' + this.slides.length;
    App.$('#prevBtn').disabled = i === 0;
    App.$('#nextBtn').disabled = i === this.slides.length - 1;
    App.sfx.click();
  },
  next() { this.goTo(this.cur + 1, 1); },
  prev() { this.goTo(this.cur - 1, -1); },
};

}

    function pickAlas(label) {

    }
    function reset() {
      curFaces = crossFaces.map(f => ({ ...f }));
      App.labelFaces(curFaces);
      msg.textContent = 'Pilih dulu sisi alasnya, lalu saksikan kubus melipat diri!';
      wrap.innerHTML = '';
      wrap.appendChild(App.netSVG(curFaces, { unit: 54, clickable: true, onFaceClick: pickAlas }));
      foldApi = App.buildFoldable(panel, curFaces, { rx: -20, ry: -28, maxUnit: 78 });
      App.$('#labFold', el).onclick = () => foldApi.setFolded(true);
      App.$('#labUnfold', el).onclick = () => foldApi.setFolded(false);
    }
    App.$('#labReset', el).onclick = reset;
    reset();
  },
});

// ============================================================
// SLIDE 8 — BERLATIH (kontainer kuis)
// ============================================================
deck.add({
  id: 'slide-quiz',
  build(el) {
    el.innerHTML = slideShell(`
      <h2 class="slide-title">Arena Berlatih</h2>
      <div id="quizArea"></div>
    `);
    if (window.Quiz) Quiz.mount(App.$('#quizArea', el));
  },
});

// ============================================================
// SLIDE 9 — PENUTUP
// ============================================================
deck.add({
  id: 'slide-end',
  build(el) {
    el.innerHTML = slideShell(`
      <div class="kicker">Selamat!</div>
      <h1 class="judul">Kamu <span class="grad">Hebat</span>!</h1>
      <p class="sub">Kini kamu sudah mengenal jaring-jaring kubus &amp; balok. Ingat kembali tiga harta pengetahuan ini:</p>
      <div class="recap-grid">
        <div class="card"><h3>Kubus</h3><p>6 sisi persegi <b>sama besar</b>, 12 rusuk sama panjang, 8 titik sudut. Jaring-jaringnya ada <b>11</b> bentuk.</p></div>
        <div class="card"><h3>Balok</h3><p>6 sisi dalam <b>3 pasang kembar</b>, 12 rusuk dalam 3 kelompok, 8 titik sudut. Jaring-jaringnya ada <b>54</b> bentuk.</p></div>
        <div class="card"><h3>Alas &amp; Atap</h3><p>Sisi berhadapan <b>tidak saling menempel</b>. Pada kubus: lompati satu kotak. Pada balok: cari <b>kembarannya</b>!</p></div>
      </div>
      <div class="cover-actions" style="justify-content:center">
        <button class="btn primary" id="againBtn">${App.icon('refresh')} Pelajari Lagi</button>
        <button class="btn green" id="reQuiz">Uji Lagi Kemampuanmu</button>
      </div>
    `);
    App.$('#againBtn', el).onclick = () => deck.goTo(1, -1);
    App.$('#reQuiz', el).onclick = () => { deck.goTo(8, -1); if (window.Quiz) Quiz.open(); };
  },
});

// ---------- init ----------
function init() {
  decorBG();
  // ikon tombol tetap
  App.$('#prevBtn').innerHTML = App.icon('left');
  App.$('#nextBtn').innerHTML = App.icon('right');
  App.$('#homeBtn').innerHTML = App.icon('home');
  App.$('#soundBtn').innerHTML = App.icon('sound');
  App.$('#fsBtn').innerHTML = App.icon('full');
  // bangun wadah slide
  const d = App.$('#deck');
  deck.slides.forEach(s => {
    const el = App.el('section', 'slide'); el.id = s.id;
    d.appendChild(el);
  });
  App.$('#prevBtn').onclick = () => deck.prev();
  App.$('#nextBtn').onclick = () => deck.next();
  App.$('#homeBtn').onclick = () => deck.goTo(1, -1);
  App.$('#soundBtn').onclick = function () {
    App.sfx.muted = !App.sfx.muted;
    this.innerHTML = App.sfx.muted ? App.icon('mute') : App.icon('sound');
    this.classList.toggle('off', App.sfx.muted);
  };
  App.$('#fsBtn').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  };
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') deck.next();
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') deck.prev();
    else if (e.key === 'Home') deck.goTo(0, -1);
    else if (e.key === 'End') deck.goTo(deck.slides.length - 1, 1);
  });
  deck.goTo(0, 1);
}
document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', init) : init();
})();

</script>
<script>
// ============================================================
// quiz.js — Arena berlatih: mode latihan terpandu & kuis ber-skor
// ============================================================
(function () {
'use strict';
const D = window.PRESENTATION_DATA;
const App = window.App;
const Quiz = window.Quiz = {};
let area = null;
const S = { mode: null, idx: 0, answers: [], done: false };

Quiz.mount = function (el) { area = el; home(); };
Quiz.open = function () { if (area) home(); };

function esc(s) { return s; }

function home() {
  S.mode = null; S.idx = 0; S.answers = []; S.done = false;
  area.innerHTML = `
    <p class="sub">Ayo uji kemampuanmu dengan <b>18 soal berjenjang</b>: 6 soal mudah, 6 sedang, dan 6 tantangan. Pilih mode yang kamu mau:</p>
    <div class="mode-cards">
      <button class="mode-card" id="modeLatihan">
        <span class="m-emoji" style="background:linear-gradient(135deg,#86efac,#22c55e)">${App.icon('eye')}</span>
        <h4>Mode Latihan</h4>
        <p>Setiap jawaban langsung diberi tahu <b>benar atau salah</b> lengkap dengan <b>pembahasannya</b>. Cocok untuk belajar pelan-pelan.</p>
        <span class="btn small green">${App.icon('play')} Mulai Latihan</span>
      </button>
      <button class="mode-card" id="modeKuis">
        <span class="m-emoji" style="background:linear-gradient(135deg,#fde047,#f59e0b)">${App.icon('star')}</span>
        <h4>Mode Kuis</h4>
        <p>Jawab 18 soal tanpa pembahasan. Di akhir, lihat <b>skor dan bintangmu</b>! Berani mencoba?</p>
        <span class="btn small primary">${App.icon('play')} Mulai Kuis</span>
      </button>
    </div>
    <div class="card" style="align-self:center;max-width:720px;text-align:center;background:#eef2ff;border-color:#c7d2fe">
      <p>Jenis soal: <b>menentukan sisi ATAP jika ALAS diketahui</b> (kubus &amp; balok), dan <b>menentukan apakah sebuah gambar merupakan jaring-jaring kubus/balok atau bukan</b>.</p>
    </div>
  `;
  App.$('#modeLatihan', area).onclick = () => start('latihan');
  App.$('#modeKuis', area).onclick = () => start('kuis');
}

function start(mode) {
  S.mode = mode; S.idx = 0; S.answers = []; S.done = false;
  App.sfx.pop();
  render();
}

function render() {
  const q = D.questions[S.idx];
  const dots = D.questions.map((_, i) => {
    let cls = '';
    if (S.answers[i] != null) cls = S.answers[i] ? 'done' : 'fail';
    if (i === S.idx && S.mode === 'latihan') cls = 'now';
    if (i === S.idx && S.mode === 'kuis') cls = 'now';
    return `<i class="${cls}"></i>`;
  }).join('');
  const isYaBukan = q.kind === 'ya-bukan';
  const optsHtml = q.options.map((o, i) => {
    if (isYaBukan) {
      const yes = o.label.indexOf('Ya') === 0;
      return `<button class="opt big-${yes ? 'yes' : 'no'}" data-i="${i}">${yes ? App.icon('check') : App.icon('mute')} ${o.label}</button>`;
    }
    return `<button class="opt" data-i="${i}"><span class="sw" style="background:${App.PALETTE[o.face]}"></span>${o.label}</button>`;
  }).join('');

  area.innerHTML = `
    <div class="q-top">
      <span class="level-chip level-${q.level}">${q.level}</span>
      <span class="chip">Soal <b>&nbsp;${S.idx + 1} / ${D.questions.length}</b></span>
      ${S.mode === 'kuis' ? `<span class="chip">Mode Kuis</span>` : `<span class="chip">Mode Latihan</span>`}
      <button class="btn small" id="qExit">Keluar</button>
    </div>
    <div class="q-prog">${dots}</div>
    <div class="q-card">
      <div class="q-svg-wrap" id="qSvg"></div>
      <div class="q-body">
        <div class="q-prompt">${q.prompt}</div>
        <div class="opts" id="qOpts">${optsHtml}</div>
        <div class="explain" id="qExplain"></div>
        <div class="q-actions" id="qActions"></div>
      </div>
    </div>
  `;
  const svgHost = App.$('#qSvg', area);
  const svg = App.netSVG(q.faces, { unit: q.faces[0].w !== 1 ? 42 : 52, sizes: q.faces[0].w !== 1, markAlas: isYaBukan ? null : q.alas });
  svgHost.appendChild(svg);
  App.$('#qExit', area).onclick = () => { App.sfx.click(); home(); };

  let answered = false;
  area.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (answered) return;
    answered = true;
    const o = q.options[+b.dataset.i];
    S.answers[S.idx] = o.correct;
    if (S.mode === 'latihan') answerLatihan(q, o, b);
    else { if (o.correct) { App.sfx.ok(); } else { App.sfx.no(); } setTimeout(next, 750); }
  });
}

function answerLatihan(q, chosen, btn) {
  const opts = area.querySelectorAll('.opt');
  opts.forEach((b, i) => {
    b.disabled = true;
    if (q.options[i].correct) b.classList.add('correct');
    else if (b === btn) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const isYaBukan = q.kind === 'ya-bukan';
  let mini = '';
  if (!isYaBukan) {
    mini = `<div class="mini-svg" id="miniSvg"></div>`;
  }
  const ex = App.$('#qExplain', area);
  ex.className = 'explain show ' + (chosen.correct ? 'good' : 'bad');
  ex.innerHTML = `
    <div class="ex-title">${chosen.correct ? App.icon('check') + ' Benar sekali!' : 'Belum tepat. Tidak apa-apa, yuk belajar!'}</div>
    <div>${q.explanation}</div>
    ${mini}`;
  if (chosen.correct) { App.sfx.ok(); } else { App.sfx.no(); }
  if (!isYaBukan) {
    const ms = App.$('#miniSvg', ex);
    ms.appendChild(App.netSVG(q.faces, { unit: 30, sizes: q.faces[0].w !== 1, markAlas: q.alas, markAtap: isYaBukan ? null : q.atap, clickable: false }));
  }
  const act = App.$('#qActions', area);
  const last = S.idx === D.questions.length - 1;
  act.innerHTML = `
    <button class="btn small" id="qRetry">Coba Soal Ini Lagi</button>
    <button class="btn small ${last ? 'primary' : 'green'}" id="qNext">${last ? 'Lihat Hasil' : 'Soal Berikutnya'} ${App.icon('right')}</button>`;
  App.$('#qNext', act).onclick = () => { App.sfx.click(); last ? result() : next(); };
  App.$('#qRetry', act).onclick = () => { App.sfx.click(); S.answers[S.idx] = null; render(); };
  if (chosen.correct) {
    const r = btn.getBoundingClientRect();
    App.burst(r.left + r.width / 2, r.top + r.height / 2);
  }
}

function next() {
  if (S.idx < D.questions.length - 1) { S.idx++; render(); }
  else result();
}

function result() {
  S.done = true;
  const n = D.questions.length;
  const score = S.answers.filter(Boolean).length;
  const pct = Math.round(score / n * 100);
  const stars = pct >= 90 ? 3 : pct >= 65 ? 2 : pct >= 40 ? 1 : 0;
  const pesan = stars === 3 ? 'LUAR BIASA! Kamu master jaring-jaring!'
    : stars === 2 ? 'Hebat! Sedikit lagi menuju sempurna!'
    : stars === 1 ? 'Bagus, terus berlatih ya!' : 'Jangan menyerah — pelajari lagi lalu coba lagi!';
  const starSvg = [0, 1, 2].map(i => (i < stars ? App.icon('star') : App.icon('starDim'))).join('');
  const review = D.questions.map((q, i) => {
    const ok = S.answers[i];
    return `<span class="rv ${ok ? 'ok' : 'no'}" title="Soal ${i + 1}: ${q.level} — ${ok ? 'benar' : 'salah'}">${ok ? App.icon('check') : (i + 1)}</span>`;
  }).join('');
  area.innerHTML = `
    <div class="result-wrap">
      <div class="kicker">${S.mode === 'kuis' ? 'Hasil Kuis' : 'Hasil Latihan'}</div>
      <div class="score-big">${score} / ${n}</div>
      <div class="stars">${starSvg}</div>
      <p class="sub">${pesan}</p>
      <div class="review-grid">${review}</div>
      ${score < n ? `<div class="card" style="max-width:640px;text-align:left">
        <h3>Periksa soal yang keliru</h3>
        ${D.questions.map((q, i) => S.answers[i] ? '' : `
          <p style="margin-top:8px"><b>Soal ${i + 1}</b> (${q.level}): ${q.kind === 'ya-bukan'
            ? (q.options.find(o => o.correct).label) + '. ' + q.explanation
            : 'Jawaban benar: <b>' + q.options.find(o => o.correct).label + '</b>. ' + q.explanation}</p>`).join('')}
      </div>` : ''}
      <div class="cover-actions">
        <button class="btn primary" id="rAgain">${App.icon('refresh')} Ulangi</button>
        <button class="btn green" id="rSwitch">${S.mode === 'kuis' ? 'Coba Mode Latihan' : 'Coba Mode Kuis'}</button>
        <button class="btn" id="rHome">Ke Peta Materi</button>
      </div>
    </div>`;
  if (stars >= 2) {
    const r = App.$('.score-big', area).getBoundingClientRect();
    let k = 0;
    const iv = setInterval(() => { App.burst(r.left + r.width / 2 + (Math.random() - .5) * 300, r.top + 40); if (++k >= 3) clearInterval(iv); }, 350);
  }
  if (score === n) App.sfx.ok(); else App.sfx.pop();
  App.$('#rAgain', area).onclick = () => start(S.mode);
  App.$('#rSwitch', area).onclick = () => start(S.mode === 'kuis' ? 'latihan' : 'kuis');
  App.$('#rHome', area).onclick = () => { App.deck.goTo(1, -1); };
}
})();

</script>
